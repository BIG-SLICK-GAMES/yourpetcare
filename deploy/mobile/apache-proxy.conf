# Include inside the existing HTTPS VirtualHost only.
# A dedicated prefix keeps existing game routes unchanged.
ProxyPass /yourpetcare-api/ http://127.0.0.1:3060/ connectiontimeout=5 timeout=40
ProxyPassReverse /yourpetcare-api/ http://127.0.0.1:3060/
<Location /yourpetcare-api/>
    Header always set Cache-Control "no-store"
</Location>
