# Include inside the existing admin.21-holdem.com HTTPS VirtualHost.
Alias /pet-care/ /opt/yourpetcare-mobile-api/admin/
<Directory /opt/yourpetcare-mobile-api/admin>
    Require all granted
    Options -Indexes
    AllowOverride None
    DirectoryIndex index.html
    Header always set Cache-Control "no-store"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
    Header always set X-Content-Type-Options "nosniff"
</Directory>
ProxyPass /pet-care-api/ http://127.0.0.1:3060/
ProxyPassReverse /pet-care-api/ http://127.0.0.1:3060/
