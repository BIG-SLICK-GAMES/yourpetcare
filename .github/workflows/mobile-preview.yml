name: Mobile web preview
on:
  push:
    branches: [mobile]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mobile-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: node --test mobile-server/test/*.test.js
      - run: npm ci
        working-directory: mobile
      - run: npm run typecheck && npm run lint && npm run export:web
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: https://21-holdem.com/yourpetcare-api
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
