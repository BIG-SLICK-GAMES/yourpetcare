name: Mobile web preview
on:
  push:
    branches: [mobile, petstock, petbarn, petsonline]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mobile-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [mobile, petstock, petbarn, petsonline]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile-server
      - run: node --test mobile-server/test/*.test.js
      - run: npm ci
        working-directory: mobile
      - run: npm test && npm run typecheck && npm run lint && npm run export:web
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: https://21-holdem.com/yourpetcare-api
      - name: Verify preview routes and assets
        run: node scripts/verify-preview.cjs
        working-directory: mobile
        env:
          BRANCH: ${{ matrix.branch }}
      - name: Record branch and commit
        run: |
          node -e "require('fs').writeFileSync('mobile/dist/build-info.json',JSON.stringify({branch:process.env.BRANCH,commit:require('child_process').execSync('git rev-parse HEAD').toString().trim()}))"
        env:
          BRANCH: ${{ matrix.branch }}
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.branch }}
          path: mobile/dist
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: preview-*
          path: builds
      - name: Assemble the original app and retailer previews
        run: |
          mkdir -p site
          cp -a builds/preview-mobile/. site/
          for brand in petstock petbarn petsonline; do
            mkdir -p "site/home/$brand"
            cp -a "builds/preview-$brand/." "site/home/$brand/"
          done
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
