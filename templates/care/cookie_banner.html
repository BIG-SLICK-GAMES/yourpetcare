{% if not cookie_choices and request.resolver_match.url_name != 'cookies' %}<section class="cookie-banner" aria-label="Cookie choices"><h2>Cookies</h2><p>Essential cookies support sign-in. Advertising cookies are optional.</p><form method="post" action="{% url 'cookies' %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button name="choice" value="all">Accept all cookies</button><button name="choice" value="essential">Essential only</button><a href="{% url 'cookies' %}">Choose cookies</a></form></section>{% endif %}
